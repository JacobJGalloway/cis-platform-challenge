[project]
name = "cis-hiring-seed"
version = "0.1.0"
description = "CIS platform seed slice for the Deputy CSA hiring challenge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-anyio>=0.0.0",
    "anyio>=4.4",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.pytest.ini_options]
anyio_mode = "auto"
